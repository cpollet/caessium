[package]
name = "caessium"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
# because aes-gcm's feature zeroize does not propagate to hybrid-array
hybrid-array = { version = "*", features = ["zeroize"] }
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
jiff = { version = "0.2.38",features = ["serde"] }
jsonwebtoken = "10" #waiting for https://github.com/chenhunghan/jwks/pull/32
jwks = "0.5.3"
log = "0.4.34"
oauth2 = { version = "5.0.0"}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread",] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = { version = "1.9.1" }

